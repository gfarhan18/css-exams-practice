<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS 2026 · MCQ Practice</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Back to subjects">
      <span class="brand-mark">C</span>
      <span class="brand-text"><strong>CSS 2026</strong><small>Part-I MCQ Practice</small></span>
    </button>
    <button class="ghost-btn" id="resetBtn" title="Clear all saved scores">Reset scores</button>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <footer class="foot">
    Questions from CSS 2026 papers (via cssaspirants.pk). Answer keys are practice keys, not official FPSC keys.
  </footer>

  <script src="js/quiz-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
